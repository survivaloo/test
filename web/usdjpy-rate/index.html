<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>マーケット指標</title>
<meta name="description" content="ドル円レート・日本国債30年金利・米国失業率を表示するテスト用アプリ" />

<!-- iOSでホーム画面に追加した際にアプリらしく動作させるための設定 -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="マーケット指標" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0b2d4e" />

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="manifest" href="manifest.webmanifest" />

<style>
  :root {
    color-scheme: dark;
    --bg-top: #0b2d4e;
    --bg-bottom: #0a842c;
    --card-bg: rgba(255, 255, 255, 0.08);
    --card-border: rgba(255, 255, 255, 0.14);
    --text-primary: #ffffff;
    --text-secondary: rgba(255, 255, 255, 0.7);
    --accent: #34c759;
    --danger: #ff6b6b;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    background-attachment: fixed;
    color: var(--text-primary);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    user-select: none;
  }

  .container {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    padding: 24px;
    gap: 16px;
  }

  h1.page-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--text-primary);
    margin: 8px 0 4px 0;
    text-align: center;
  }

  .card {
    width: 100%;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 22px;
    padding: 22px 20px;
    text-align: center;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
  }

  .metric-label {
    font-size: 14px;
    color: var(--text-secondary);
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }

  .metric-sub-label {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 10px;
  }

  .metric-value {
    font-size: 42px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    transition: opacity 0.2s ease;
    min-height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .metric-updated {
    margin-top: 6px;
    font-size: 12px;
    color: var(--text-secondary);
  }

  .metric-error {
    margin-top: 6px;
    font-size: 12px;
    color: var(--danger);
  }

  .spinner {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.25);
    border-top-color: #ffffff;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .refresh-icon {
    width: 18px;
    height: 18px;
    transition: transform 0.5s ease;
  }

  .refresh-icon.spinning {
    animation: spin 0.8s linear infinite;
  }

  button.refresh-btn {
    width: 100%;
    padding: 16px;
    font-size: 17px;
    font-weight: 600;
    color: #ffffff;
    background: var(--accent);
    border: none;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.2s ease;
  }

  button.refresh-btn:active {
    transform: scale(0.97);
  }

  button.refresh-btn:disabled {
    opacity: 0.6;
  }

  .install-hint {
    width: 100%;
    padding: 12px 16px;
    font-size: 13px;
    line-height: 1.5;
    color: var(--text-secondary);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    text-align: center;
  }

  .install-hint.hidden { display: none; }

  .footer-note {
    font-size: 11px;
    color: var(--text-secondary);
    text-align: center;
    padding: 4px 0 16px 0;
  }
</style>
</head>
<body>
  <div class="container">
    <h1 class="page-title">マーケット指標</h1>

    <div class="card">
      <div class="metric-label">USD / JPY</div>
      <div class="metric-sub-label">1 米ドル あたり</div>
      <div id="usdjpyValue" class="metric-value">--</div>
      <div id="usdjpyUpdated" class="metric-updated"></div>
      <div id="usdjpyError" class="metric-error" style="display:none;"></div>
    </div>

    <div class="card">
      <div class="metric-label">日本国債 30年金利</div>
      <div class="metric-sub-label">最新値</div>
      <div id="jgbValue" class="metric-value">--</div>
      <div id="jgbUpdated" class="metric-updated"></div>
      <div id="jgbError" class="metric-error" style="display:none;"></div>
    </div>

    <div class="card">
      <div class="metric-label">米国 失業率</div>
      <div class="metric-sub-label">雇用統計(BLS)</div>
      <div id="unrateValue" class="metric-value">--</div>
      <div id="unrateUpdated" class="metric-updated"></div>
      <div id="unrateError" class="metric-error" style="display:none;"></div>
    </div>

    <div id="installHint" class="install-hint hidden">
      このページをホーム画面に追加すると、アプリのように使えます。<br />
      Safari下部の「共有」ボタン → 「ホーム画面に追加」をタップしてください。
    </div>

    <button id="refreshBtn" class="refresh-btn">
      <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <polyline points="1 20 1 14 7 14"></polyline>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
      </svg>
      <span id="refreshLabel">更新する</span>
    </button>

    <div class="footer-note">
      為替: Frankfurter API(リアルタイム)/ 国債金利: 財務省(日次更新)/ 失業率: 米国労働統計局(月次更新)
    </div>
  </div>

<script>
  // api.frankfurter.app はリダイレクト(CORSヘッダーなし)を返すため、
  // Safariのfetchでリダイレクト追従時にブロックされる。リダイレクトされない
  // 新エンドポイントを直接使用する。
  const USDJPY_API_URL = "https://api.frankfurter.dev/v1/latest?from=USD&to=JPY";

  // 財務省の国債金利CSV・BLSの失業率APIはブラウザから直接取得するとCORSで
  // ブロックされるため、GitHub Actionsで定期取得したJSONを同一オリジンから読む。
  const MARKET_DATA_URL = "./market-data.json";

  const usdjpyValueEl = document.getElementById("usdjpyValue");
  const usdjpyUpdatedEl = document.getElementById("usdjpyUpdated");
  const usdjpyErrorEl = document.getElementById("usdjpyError");

  const jgbValueEl = document.getElementById("jgbValue");
  const jgbUpdatedEl = document.getElementById("jgbUpdated");
  const jgbErrorEl = document.getElementById("jgbError");

  const unrateValueEl = document.getElementById("unrateValue");
  const unrateUpdatedEl = document.getElementById("unrateUpdated");
  const unrateErrorEl = document.getElementById("unrateError");

  const refreshBtn = document.getElementById("refreshBtn");
  const refreshIcon = refreshBtn.querySelector(".refresh-icon");
  const installHint = document.getElementById("installHint");

  function isStandalone() {
    return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  }

  if (!isStandalone()) {
    installHint.classList.remove("hidden");
  }

  function spinnerHtml() {
    return '<div class="spinner"></div>';
  }

  function setRefreshing(isRefreshing) {
    refreshBtn.disabled = isRefreshing;
    refreshIcon.classList.toggle("spinning", isRefreshing);
  }

  async function fetchUsdJpy() {
    usdjpyErrorEl.style.display = "none";
    usdjpyValueEl.innerHTML = spinnerHtml();

    try {
      const res = await fetch(USDJPY_API_URL, { cache: "no-store" });
      if (!res.ok) throw new Error("サーバーからの応答が正しくありません。");
      const data = await res.json();
      const rate = data.rates && data.rates.JPY;
      if (typeof rate !== "number") throw new Error("レート情報が見つかりませんでした。");

      usdjpyValueEl.textContent = "¥" + rate.toFixed(2);
      usdjpyUpdatedEl.textContent = "最終更新日: " + data.date;
    } catch (err) {
      usdjpyValueEl.textContent = "--";
      usdjpyErrorEl.textContent = "取得に失敗しました: " + err.message;
      usdjpyErrorEl.style.display = "block";
    }
  }

  async function fetchMarketData() {
    jgbErrorEl.style.display = "none";
    unrateErrorEl.style.display = "none";
    jgbValueEl.innerHTML = spinnerHtml();
    unrateValueEl.innerHTML = spinnerHtml();

    let data;
    try {
      const res = await fetch(MARKET_DATA_URL, { cache: "no-store" });
      if (!res.ok) throw new Error("データファイルの取得に失敗しました。");
      data = await res.json();
    } catch (err) {
      const message = "取得に失敗しました: " + err.message;
      jgbValueEl.textContent = "--";
      jgbErrorEl.textContent = message;
      jgbErrorEl.style.display = "block";
      unrateValueEl.textContent = "--";
      unrateErrorEl.textContent = message;
      unrateErrorEl.style.display = "block";
      return;
    }

    if (data.jgb_30y) {
      jgbValueEl.textContent = data.jgb_30y.value.toFixed(3) + "%";
      jgbUpdatedEl.textContent = "基準日: " + (data.jgb_30y.date_label || data.jgb_30y.date);
    } else {
      jgbValueEl.textContent = "--";
      jgbErrorEl.textContent = "国債金利データがありません。";
      jgbErrorEl.style.display = "block";
    }

    if (data.us_unemployment) {
      unrateValueEl.textContent = data.us_unemployment.value.toFixed(1) + "%";
      unrateUpdatedEl.textContent = "対象月: " + (data.us_unemployment.period_name || data.us_unemployment.period);
    } else {
      unrateValueEl.textContent = "--";
      unrateErrorEl.textContent = "失業率データがありません。";
      unrateErrorEl.style.display = "block";
    }
  }

  async function fetchAll() {
    setRefreshing(true);
    await Promise.all([fetchUsdJpy(), fetchMarketData()]);
    setRefreshing(false);
  }

  refreshBtn.addEventListener("click", fetchAll);

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") fetchAll();
  });

  fetchAll();

  // 以前登録していたService Workerが古いキャッシュを返し続ける問題があったため、
  // 新規登録は行わず、既存の登録があれば掃除する(sw.js側でも自己解除する)。
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations().then((regs) => {
      regs.forEach((reg) => reg.unregister());
    });
    if (window.caches) {
      caches.keys().then((keys) => keys.forEach((key) => caches.delete(key)));
    }
  }
</script>
</body>
</html>
